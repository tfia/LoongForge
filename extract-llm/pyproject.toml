[project]
name = "loongarch-gcc-extract-llm"
version = "0.1.0"
description = "Extract feature invariants from archived LoongArch GCC bug reports for compiler quality testing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LoongArch GCC quality engineering" }]
dependencies = []

[project.scripts]
extract-llm = "extract_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extract_llm"]
