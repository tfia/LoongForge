[project]
name = "loongarch-gcc-instan-llm"
version = "0.1.0"
description = "Instantiate GroupLLM feature groups into compiler-quality tests and collect AFL++ coverage"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LoongArch GCC quality engineering" }]
dependencies = []

[project.scripts]
instan-llm = "instan_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instan_llm"]
