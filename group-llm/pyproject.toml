[project]
name = "loongarch-gcc-group-llm"
version = "0.1.0"
description = "Synthesize coherent compiler-quality feature groups from an ExtractLLM feature pool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LoongArch GCC quality engineering" }]
dependencies = []

[project.scripts]
group-llm = "group_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/group_llm"]
