[project]
name = "loongarch-gcc-bug-corpus"
version = "0.1.0"
description = "Build a traceable LoongArch GCC quality-test corpus from GCC Bugzilla"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LoongArch GCC quality engineering" }]
dependencies = []

[project.scripts]
loongarch-bug-corpus = "loongarch_bug_corpus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loongarch_bug_corpus"]
